[package]
name = "sericom-core"
description = "The underlying library for sericom"
version = "0.7.0"
license = "MIT"
readme = "README.md"
edition.workspace = true
exclude.workspace = true
repository.workspace = true

[dependencies]
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"
chrono.workspace = true
crossterm.workspace = true
miette.workspace = true
serial2-tokio = { workspace = true, features = ["windows"] }
tokio.workspace = true
tracing = { workspace = true, features = ["attributes"] }

[dev-dependencies]
test-log = {version = "0.2.18", default-features = false, features = ["trace", "color"]}
test-sericom = { version = "0.1.0", path = "../test-sericom" }

[lints.clippy]
pedantic = "warn"
perf = "warn"
nursery = "warn"
