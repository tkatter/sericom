[workspace]
members = ["sericom", "sericom-core", "test-sericom"]
resolver = "3"

[workspace.package]
edition = "2024"
exclude = ["configuration/*", ".github/*"]
readme = "README.md"
repository = "https://github.com/tkatter/sericom"

[workspace.dependencies]
chrono = "0.4.42"
crossterm = { version = "0.29.0", features = ["osc52", "event-stream"] }
miette = "7.6.0"
tokio = { version = "1.48.0", features = ["full"] }
serial2-tokio = "0.1.19"
tracing = "0.1.43"

[patch.crates-io]
sericom-core = { path = "sericom-core" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
